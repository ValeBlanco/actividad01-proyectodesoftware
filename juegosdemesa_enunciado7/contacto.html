<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Reseñas de Juegos de Mesa</title>
  <link rel="stylesheet" href="estilosIA.css">
</head>
<body>

  <header class="encabezado">
    <h1 class="titulo-sitio">🎲 Reseñas de Juegos de Mesa 🎲</h1>
    <nav class="nav-principal">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="contacto.html" class="activo">Contacto</a>
      <a href="quienes-somos.html">Quiénes somos</a>
    </nav>
  </header>

  <main class="contenedor">
    <section class="intro">
      <h2>Contacto</h2>
      <p class="datos-contacto">
        ¿Querés sugerir un juego para reseñar o comentarnos algo del sitio?
        Completá el siguiente formulario.
      </p>
    </section>

    <form class="formulario-contacto" action="mailto:contacto@resenasjuegosdemesa.example" method="post" enctype="text/plain">
      <label for="nombre">
        Nombre
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
      </label>

      <label for="email">
        Correo electrónico
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
      </label>

      <label for="asunto">
        Asunto
        <input type="text" id="asunto" name="asunto" placeholder="Motivo del mensaje">
      </label>

      <label for="mensaje">
        Mensaje
        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu mensaje aquí" required></textarea>
      </label>

      <button type="submit">Enviar mensaje</button>
    </form>
  </main>

  <footer class="pie">
    <p>Sitio de reseñas de juegos de mesa - Proyecto de ejemplo, sin fines comerciales.</p>
  </footer>

</body>
</html>
